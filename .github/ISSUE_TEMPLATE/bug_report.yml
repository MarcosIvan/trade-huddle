name: Bug report
description: Something on the site is wrong or broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not** include league IDs, usernames,
        e-mails or screenshots of a real league. For security problems, follow
        [SECURITY.md](https://github.com/MarcosIvan/trade-huddle/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it also happens in the demo league (`?demo`), say so.
      placeholder: |
        1. Open the demo league
        2. Go to ...
        3. See ...
  - type: dropdown
    id: league
    attributes:
      label: League type
      options:
        - Redraft
        - Dynasty or keeper
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 140 on Android
