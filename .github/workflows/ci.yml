# Checks every pull request and every push to main: the site (lint, types,
# tests, formatting, build, npm audit), end-to-end tests of the built site
# (Playwright) and the stats pipeline (ruff, mypy, pytest). Nothing is
# deployed here; see deploy.yml.
#
# Security notes:
#   - pull_request (never pull_request_target): code from forks and from
#     Dependabot runs with a read-only token and no secrets.
#   - Actions are pinned to full commit SHAs (version in the comment), the
#     same ones deploy.yml uses.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same pull request cancels the run still going.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Build
        env:
          # Same base path as the deployed site, so the build is the real one.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Blocks on what ships in the site. Dev tools (lint, tests, build helpers) never
      # reach the browser, and an advisory there may have no fix yet, so it only warns.
      - name: Known vulnerabilities (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Known vulnerabilities in dev tools (warning only)
        run: |
          npm audit --audit-level=high ||
            echo "::warning title=npm audit (dev tools)::High or critical advisories in dev dependencies; see this step's log"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Build and serve under the deployed base path, like GitHub Pages.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Sleeper's API is mocked in every test; nothing leaves the runner.
        run: npm run test:e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The official gitleaks release (MIT), checked against the SHA-256 in
      # its release's checksums file, instead of gitleaks-action (a
      # proprietary license, and it wants a token that can comment on PRs).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a secret removed later is still in old commits.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner --exit-code 1'

  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install the pipeline and its dev tools
        # Every package, dev tools included, pinned with its hashes; then the
        # pipeline itself from this checkout, without dependencies.
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

      - name: Types
        run: mypy src tests

      - name: Tests
        run: pytest
