# CodeQL code scanning: the site (JavaScript/TypeScript), the stats pipeline
# (Python) and these workflows (GitHub Actions). Results appear under
# Security → Code scanning.
#
# Security notes:
#   - Read-only by default; only the analysis job may write security events.
#   - pull_request, never pull_request_target.
#   - GitHub-owned actions pinned to full commit SHAs (version in the comment).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, for new queries on unchanged code: Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Nothing to compile: the code is analyzed as written.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
