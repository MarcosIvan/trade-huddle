# Builds the stats file from Sleeper's public API and deploys the site to GitHub Pages.
#
# Security notes:
#   - No secrets are used. Sleeper's API is public.
#   - The default token is read-only; only the deploy job may publish to Pages.
#   - Runs daily, on manual dispatch and on pushes to main. Never on pull
#     requests, so outside code can't run with deploy permissions.
#   - Actions are pinned to full commit SHAs (version in the comment).
name: Build and deploy

on:
  schedule:
    # Every morning, 10:00 UTC: stats, injuries and next week's projections.
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install the data pipeline
        run: |
          pip install -r pipeline/requirements.txt
          pip install --no-deps -e pipeline

      - name: Build the stats file
        run: python -m trade_huddle_data build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the site
        working-directory: web
        env:
          # The site lives at https://<owner>.github.io/<repository>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
