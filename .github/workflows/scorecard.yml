# OpenSSF Scorecard: rates the repository's security practices (branch
# protection, pinned dependencies, token permissions, code review…). Results
# go to Security → Code scanning and to the public badge in the README.
#
# Follows the Scorecard action's own template: publishing results requires
# no top-level env or defaults and only a few known actions in this job.
#
# Security notes:
#   - read-all by default; the job gets only security-events (upload) and
#     id-token (to prove the results come from this repository).
#   - Actions pinned to full commit SHAs (version in the comment).
#     ossf/scorecard-action is the one third-party action the repository
#     allows (Settings → Actions → allowed actions).
name: Scorecard

on:
  # Re-rate when branch protection changes.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly: Mondays, 07:30 UTC.
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
