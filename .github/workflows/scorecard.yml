# OpenSSF Scorecard: rates the repository's security practices (branch
# protection, pinned dependencies, token permissions, code review…). Results
# go to Security → Code scanning and to the public badge in the README.
#
# Follows the Scorecard action's own template: publishing results requires
# no top-level env or defaults and only a few known actions in this job.
#
# Security notes:
#   - read-all by default; the job gets only security-events (upload) and
#     id-token (to prove the results come from this repository).
#   - Actions pinned to full commit SHAs (version in the comment).
#     ossf/scorecard-action is the one third-party action the repository
#     allows (Settings → Actions → allowed actions).
name: Scorecard

on:
  # Re-rate when branch protection changes.
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly: Mondays, 07:30 UTC.
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
