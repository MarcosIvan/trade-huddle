# Opens pull requests when GitHub Actions, Python or npm dependencies have
# updates, including security fixes. Each entry must point at the directory
# that holds the manifest files; Dependabot does not search subfolders.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Stats pipeline (pyproject.toml, requirements.txt) and the optional
  # Google Sheets export (requirements-sheets.txt).
  - package-ecosystem: pip
    directories:
      - /pipeline
      - /tools
    schedule:
      interval: weekly

  # The Next.js site. Minor and patch updates of build and test tools come as
  # one pull request; the app's runtime (next, react) comes one by one.
  #
  # Major versions are updated by hand, once the ecosystem supports them:
  # ESLint 10 and TypeScript 7 broke the lint (eslint-config-next and
  # typescript-eslint did not support them yet), and @types/node must stay on
  # the Node version the project runs (22). This also skips security fixes
  # that exist only in a new major; those still show up as Dependabot alerts.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
