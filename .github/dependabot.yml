# Keeps GitHub Actions, Python and npm dependencies up to date. Each entry must
# point at the directory that holds the manifest files; Dependabot does not
# search subfolders.
#
# Routine updates come once a month, grouped into one pull request per entry
# (and per directory for pip), so they are few and easy to follow. Security
# fixes are not grouped or scheduled: Dependabot opens them as soon as an
# advisory is published (groups only apply to version updates by default).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # Stats pipeline (pyproject.toml, requirements.txt) and the optional
  # Google Sheets export (requirements-sheets.txt).
  - package-ecosystem: pip
    directories:
      - /pipeline
      - /tools
    schedule:
      interval: monthly
    groups:
      python:
        patterns:
          - "*"

  # The Next.js site: the app's runtime and its build and test tools together.
  #
  # Major versions are updated by hand, once the ecosystem supports them:
  # ESLint 10 and TypeScript 7 broke the lint (eslint-config-next and
  # typescript-eslint did not support them yet), and @types/node must stay on
  # the Node version the project runs (22). This also skips security fixes
  # that exist only in a new major; those still show up as Dependabot alerts.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      site:
        patterns:
          - "*"
