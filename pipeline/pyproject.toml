[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-huddle-data"
version = "0.1.0"
description = "Builds the league-independent stats file for Trade Huddle from Sleeper's public API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["requests==2.34.2"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-requests==2.33.0.20260906",
]

[project.scripts]
trade-huddle-data = "trade_huddle_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101"] # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
